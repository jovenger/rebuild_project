<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7B5CFF"/>
      <stop offset="1" stop-color="#3A2A8C"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3A4155"/>
      <stop offset="0.5" stop-color="#2A3042"/>
      <stop offset="1" stop-color="#1D2231"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="958" height="438" rx="18" fill="#F7F8FB" stroke="#E2E5EE" stroke-width="2"/>
  <text x="40" y="58" font-size="24" font-weight="700" fill="#1F2430">Montage 1 — Micro USB avec prise casque</text>
  <text x="40" y="86" font-size="15" fill="#5B6275">Le plus simple : un seul câble, et tu t'entends directement par le micro.</text>

  <!-- Badge -->
  <rect x="660" y="34" width="262" height="46" rx="23" fill="#E7F7EF" stroke="#1FA971" stroke-width="2"/>
  <path d="M684 57 l8 8 l16 -18" fill="none" stroke="#1FA971" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="716" y="63" font-size="17" font-weight="700" fill="#137A50">Retour direct : 0 ms</text>

  <!-- PC portable -->
  <rect x="70" y="140" width="220" height="140" rx="12" fill="#1F2430"/>
  <rect x="82" y="152" width="196" height="116" rx="5" fill="url(#screen)"/>
  <polyline points="96,212 110,198 122,226 136,186 150,236 164,204 178,220 192,192 206,230 220,206 234,216 248,200 262,212" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round" opacity="0.9"/>
  <path d="M48 288 H312 L292 310 H68 Z" fill="#C9CEDA"/>
  <rect x="150" y="288" width="60" height="6" rx="3" fill="#AEB4C3"/>
  <rect x="288" y="232" width="10" height="16" rx="2" fill="#5B6275"/>
  <text x="180" y="336" font-size="16" font-weight="600" fill="#1F2430" text-anchor="middle">PC (Windows)</text>
  <text x="180" y="356" font-size="13" fill="#5B6275" text-anchor="middle">StudioVoix</text>

  <!-- Câble USB -->
  <path d="M298 240 C 380 240, 420 312, 506 286" fill="none" stroke="#6C4CF5" stroke-width="7" stroke-linecap="round"/>
  <rect x="356" y="250" width="56" height="28" rx="14" fill="#6C4CF5"/>
  <text x="384" y="270" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">USB</text>

  <!-- Micro USB sur pied -->
  <ellipse cx="530" cy="332" rx="62" ry="11" fill="#C9CEDA"/>
  <rect x="524" y="290" width="12" height="42" fill="#5B6275"/>
  <rect x="492" y="120" width="76" height="176" rx="38" fill="url(#body)"/>
  <rect x="500" y="128" width="60" height="84" rx="30" fill="#4A5166"/>
  <g stroke="#2A3042" stroke-width="2">
    <line x1="506" y1="146" x2="554" y2="146"/>
    <line x1="502" y1="160" x2="558" y2="160"/>
    <line x1="502" y1="174" x2="558" y2="174"/>
    <line x1="502" y1="188" x2="558" y2="188"/>
    <line x1="506" y1="202" x2="554" y2="202"/>
  </g>
  <circle cx="530" cy="236" r="9" fill="#6C4CF5"/>
  <line x1="530" y1="229" x2="530" y2="236" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
  <circle cx="550" cy="276" r="6" fill="#0E1118" stroke="#AEB4C3" stroke-width="2"/>
  <text x="590" y="232" font-size="13" fill="#5B6275">gain</text>
  <line x1="541" y1="236" x2="584" y2="229" stroke="#AEB4C3" stroke-width="1.5"/>
  <text x="530" y="366" font-size="16" font-weight="600" fill="#1F2430" text-anchor="middle">Micro USB</text>
  <text x="530" y="386" font-size="13" fill="#5B6275" text-anchor="middle">cardioïde, avec sortie casque</text>

  <!-- Casque -->
  <path d="M752 214 A62 62 0 0 1 876 214" fill="none" stroke="#2A3042" stroke-width="13" stroke-linecap="round"/>
  <rect x="734" y="204" width="34" height="66" rx="14" fill="url(#body)"/>
  <rect x="860" y="204" width="34" height="66" rx="14" fill="url(#body)"/>
  <rect x="764" y="214" width="8" height="46" rx="4" fill="#4A5166"/>
  <rect x="856" y="214" width="8" height="46" rx="4" fill="#4A5166"/>
  <text x="814" y="306" font-size="16" font-weight="600" fill="#1F2430" text-anchor="middle">Casque fermé filaire</text>

  <!-- Câble casque -> prise du micro -->
  <path d="M750 270 C 720 340, 610 330, 556 280" fill="none" stroke="#1FA971" stroke-width="5" stroke-linecap="round"/>
  <rect x="604" y="318" width="132" height="26" rx="13" fill="#1FA971"/>
  <text x="670" y="336" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">prise du micro</text>

  <!-- Réglages -->
  <rect x="40" y="398" width="880" height="30" rx="10" fill="#EEF0F6"/>
  <text x="56" y="418" font-size="14" fill="#1F2430"><tspan font-weight="700">Paramètres StudioVoix :</tspan> entrée = micro USB · sortie = micro USB (casque) · écoute logicielle désactivée</text>
</svg>
