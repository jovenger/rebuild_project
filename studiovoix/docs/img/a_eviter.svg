<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3A4155"/>
      <stop offset="0.5" stop-color="#2A3042"/>
      <stop offset="1" stop-color="#1D2231"/>
    </linearGradient>
    <g id="cross">
      <circle cx="0" cy="0" r="17" fill="#E5484D"/>
      <path d="M-7 -7 L7 7 M7 -7 L-7 7" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
    </g>
    <g id="phones">
      <path d="M-42 6 A42 42 0 0 1 42 6" fill="none" stroke="#2A3042" stroke-width="10" stroke-linecap="round"/>
      <rect x="-56" y="0" width="26" height="50" rx="11" fill="url(#body)"/>
      <rect x="30" y="0" width="26" height="50" rx="11" fill="url(#body)"/>
    </g>
  </defs>
  <rect x="1" y="1" width="958" height="438" rx="18" fill="#F7F8FB" stroke="#E2E5EE" stroke-width="2"/>
  <text x="40" y="58" font-size="24" font-weight="700" fill="#1F2430">À éviter</text>
  <text x="40" y="86" font-size="15" fill="#5B6275">Chacun de ces montages ajoute du retard, des craquements ou de la fuite dans le micro.</text>

  <!-- 1 Bluetooth -->
  <rect x="24" y="110" width="214" height="306" rx="14" fill="#FFFFFF" stroke="#F3C9CB" stroke-width="2"/>
  <use href="#cross" x="210" y="138"/>
  <use href="#phones" x="131" y="170"/>
  <path d="M124 248 l16 14 l-8 7 v-28 l8 7 l-16 14" fill="none" stroke="#2F6FED" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="131" y="306" font-size="16" font-weight="700" fill="#1F2430" text-anchor="middle">Casque Bluetooth</text>
  <text x="131" y="330" font-size="13" fill="#5B6275" text-anchor="middle">100 à 300 ms de retard :</text>
  <text x="131" y="348" font-size="13" fill="#5B6275" text-anchor="middle">impossible de chanter</text>
  <text x="131" y="366" font-size="13" fill="#5B6275" text-anchor="middle">en rythme</text>

  <!-- 2 Hub USB -->
  <rect x="254" y="110" width="214" height="306" rx="14" fill="#FFFFFF" stroke="#F3C9CB" stroke-width="2"/>
  <use href="#cross" x="440" y="138"/>
  <rect x="306" y="196" width="110" height="44" rx="10" fill="url(#body)"/>
  <g fill="#0E1118" stroke="#AEB4C3" stroke-width="1.5">
    <rect x="318" y="210" width="16" height="10" rx="2"/><rect x="345" y="210" width="16" height="10" rx="2"/><rect x="372" y="210" width="16" height="10" rx="2"/><rect x="399" y="210" width="10" height="10" rx="2"/>
  </g>
  <path d="M326 196 C 316 160, 296 160, 286 150" fill="none" stroke="#6C4CF5" stroke-width="5" stroke-linecap="round"/>
  <path d="M353 196 C 353 170, 356 160, 360 148" fill="none" stroke="#AEB4C3" stroke-width="5" stroke-linecap="round"/>
  <path d="M380 196 C 390 170, 408 162, 420 154" fill="none" stroke="#AEB4C3" stroke-width="5" stroke-linecap="round"/>
  <path d="M361 240 C 361 262, 340 272, 330 286" fill="none" stroke="#AEB4C3" stroke-width="5" stroke-linecap="round"/>
  <text x="361" y="306" font-size="16" font-weight="700" fill="#1F2430" text-anchor="middle">Hub USB / rallonge</text>
  <text x="361" y="330" font-size="13" fill="#5B6275" text-anchor="middle">courant et débit partagés :</text>
  <text x="361" y="348" font-size="13" fill="#5B6275" text-anchor="middle">craquements, coupures</text>
  <text x="361" y="366" font-size="13" fill="#5B6275" text-anchor="middle">→ port USB direct du PC</text>

  <!-- 3 Casque sur le PC + écoute logicielle -->
  <rect x="484" y="110" width="214" height="306" rx="14" fill="#FFFFFF" stroke="#F3C9CB" stroke-width="2"/>
  <use href="#cross" x="670" y="138"/>
  <rect x="516" y="186" width="106" height="68" rx="8" fill="#1F2430"/>
  <rect x="523" y="193" width="92" height="54" rx="3" fill="#5B4AC9"/>
  <path d="M504 262 H634 L624 274 H514 Z" fill="#C9CEDA"/>
  <use href="#phones" x="652" y="196" transform="translate(652 196) scale(0.62) translate(-652 -196)"/>
  <text x="591" y="306" font-size="16" font-weight="700" fill="#1F2430" text-anchor="middle">Casque sur le PC</text>
  <text x="591" y="330" font-size="13" fill="#5B6275" text-anchor="middle">+ écoute par le logiciel :</text>
  <text x="591" y="348" font-size="13" fill="#5B6275" text-anchor="middle">retard = tampon, et deux</text>
  <text x="591" y="366" font-size="13" fill="#5B6275" text-anchor="middle">horloges qui dérivent</text>

  <!-- 4 Casque ouvert -->
  <rect x="714" y="110" width="214" height="306" rx="14" fill="#FFFFFF" stroke="#F3C9CB" stroke-width="2"/>
  <use href="#cross" x="900" y="138"/>
  <use href="#phones" x="821" y="180"/>
  <g fill="none" stroke="#F08A24" stroke-width="3" stroke-linecap="round">
    <path d="M760 200 q -12 14 0 28"/><path d="M748 192 q -18 22 0 44"/>
    <path d="M882 200 q 12 14 0 28"/><path d="M894 192 q 18 22 0 44"/>
  </g>
  <text x="821" y="306" font-size="16" font-weight="700" fill="#1F2430" text-anchor="middle">Casque ouvert</text>
  <text x="821" y="330" font-size="13" fill="#5B6275" text-anchor="middle">l'instru s'échappe et</text>
  <text x="821" y="348" font-size="13" fill="#5B6275" text-anchor="middle">repasse dans le micro</text>
  <text x="821" y="366" font-size="13" fill="#5B6275" text-anchor="middle">→ casque fermé</text>
</svg>
